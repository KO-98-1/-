code: D6
name: 총괄시험 계획서
doc: TPL
phase: design
scope: system
orientation: portrait
purpose: 개발 결과물에 대한 단계별 시험을 실시하기 위하여 필요한 시험 방법 및 소요자원, 일정 등 총괄적인 시험 계획을 수립한다.
method: 단위, 통합, 시스템, 인수 시험을 수행하기 위한 총괄시험계획 수립을 위한 절차, 자원 계획 및 산출물 계획 등을 작성한다.
depends_on: [R1, D5]
basis: "가이드 Ⅲ.2.6 목적: '단계별 시험을 실시하기 위하여 필요한 시험 방법 및 소요자원, 일정 등 총괄적인 시험 계획을 수립한다.' → 시험 대상 요구사항(R1)이 있어야 한다."   # 가이드 근거 — 이 핵심 내용을 입력·선행 산출물로 쓸 수 없으면 이 산출물은 만들지 않는다
narrative: true
entities:
  sections:
    type: sections
    desc: >-
      목차 번호(key)별 내용. 각 값은 {text: 본문(여러 줄 가능, '- ' 글머리), table: {columns: [...], rows: [[...]]},
      mermaid: 그림 코드, _meta: {...}}. 목차에 table 기본 열이 정의된 절은 같은 열로 rows를 채운다.
outline:
  - {num: "1", title: 시험 대상 시스템}
  - {num: "1.1", title: 시스템 개요, key: "1.1", desc: "시험의 대상이 되는 시스템의 개요"}
  - {num: "1.2", title: 하드웨어 구성도, key: "1.2", diagram: true, desc: "시험 대상 하드웨어 구성"}
  - {num: "1.3", title: 응용 목표시스템 구성도, key: "1.3", diagram: true, desc: "응용시스템(서브시스템) 구성"}
  - {num: "2", title: 가정 또는 제약사항, key: "2", desc: "시험 수행 시 고려되어야 할 제약사항 등"}
  - {num: "3", title: 시험 전략}
  - {num: "3.1", title: 시험 범위, key: "3.1", table: {columns: [구분, 시험항목]}, desc: "서브시스템별 시험 범위"}
  - {num: "3.2", title: 개발 단계별 수행할 시험 종류, key: "3.2", table: {columns: [구분, 단위시험, 통합시험, 시스템시험, 인수시험], rows_default: [[시험대상], [목적], [테스터], [기준선], [시험도구], [시험환경]]}}
