code: T5
name: 시스템 설치 결과서
doc: INS
phase: test
scope: system
orientation: portrait
narrative: true
purpose: 최종적으로 개발한 시스템을 사업자가 발주자에게 인도하여 시스템을 설치하기 위하여 설치환경의 내용을 기술한다.
method: >-
  시스템 개발 결과 및 이를 설치하고 운영할 수 있는 운영 환경을 구체적이고 상세하게 기술한다. 시스템의 특성에 따라
  기술하는 항목이 차이가 많이 발생할 수 있으므로 관련항목을 수정하여 사용한다. 설치 결과는 실제 설치 후에만 기재한다.
depends_on: [D5, D12]
entities:
  sections:
    type: sections
    desc: "목차 번호(key)별 내용 {text, table, mermaid, _meta}"
outline:
  - {num: "1", title: 시스템 개요}
  - {num: "1.1", title: 시스템 개요 및 특징, key: "1.1"}
  - {num: "1.2", title: 시스템 구성, key: "1.2", diagram: true}
  - {num: "1.3", title: 시스템 운영 환경, key: "1.3", table: {columns: [구분, 구성목록, 모델명, 규격, 수량, 위치]}}
  - {num: "2", title: 시스템 설치 내역}
  - {num: "2.1", title: 서버 주소, key: "2.1", table: {columns: [구분, IP, Gateway, Netmask, Interface Name]}}
  - {num: "2.2", title: 작업내역 및 결과, key: "2.2", table: {columns: [구분, 내용, 설치일시, 설치시험, 설치위치, 설치담당자]}}
  - {num: "2.3", title: 상세 작업내역, key: "2.3", table: {columns: [작업구분, 구분, 내용]}}
  - {num: "3", title: 플랫폼 설치 결과, key: "3", table: {columns: [구분, 장비, 소프트웨어명, 설치일자, 설치시험, 수량]}}
  - {num: "4", title: 데이터 전환 결과, key: "4", table: {columns: [기존 테이블명, 전환 프로그램, 결과 테이블명, 완료일자, 검증여부]}}
  - {num: "5", title: 시스템 설치 결과, key: "5", table: {columns: [시스템명, 설치일자, 설치시험, 설치담당자]}}
  - {num: "6", title: 백업 목록표, key: "6", table: {columns: [항목, 백업내용, 백업일자, 보존기간, 담당자]}}
  - {num: "7", title: 문제점 및 조치사항, key: "7", table: {columns: [구분, 문제점, 조치사항]}}
  - {num: "8", title: 기타사항, key: "8"}
layout:
  - narrative: {}
