code: D10
name: 통합시험 시나리오
doc: ITS
phase: design
scope: subsystem
orientation: landscape
results: false            # 설계단계: 시험결과는 기술하지 않음(가이드 명시)
purpose: >-
  각 응용 프로그램의 단위 프로그램 내에서의 작업 흐름 연계, 단위 프로그램간의 상호 연동 및 대내외 인터페이스를
  포함한 사용자 요구사항을 만족하는지를 검증한다.
method: 시험시나리오별로 통합 시험 케이스를 기술하고 시험 예상결과와 시험결과를 비교 할 수 있도록 한다.
depends_on: [R2, D2]
entities:
  scenarios:
    id_type: IT
    desc: 통합시험 시나리오 1개(유스케이스 단위 권장)
    fields:
      id: {label: 시험 시나리오 ID, required: true, desc: "통합 시험 시나리오에 대한 유일한 ID를 부여하여 기입한다."}
      name: {label: 시험 시나리오명, required: true, desc: "시험 시나리오의 명칭을 기입한다."}
      description: {label: 시험 시나리오 설명, desc: "시험에 대한 간략한 설명을 기술한다."}
      usecase_id: {label: 관련 유스케이스 ID, ref: UC, required: true, desc: "관련되는 유스케이스 ID를 기입한다."}
      cases:
        label: 시험 케이스
        type: object-list
        fields:
          id: {label: 시험 케이스 ID, id_type: ITC, desc: "시험 시나리오에 포함된 시험 케이스에 대한 식별자를 부여하여 기술한다."}
          description: {label: 시험 케이스 설명, desc: "시험 케이스의 간략한 설명을 기술한다."}
          procedure: {label: 시험 절차, type: steps, desc: "시험 케이스별 시험을 수행하는 절차를 기술한다."}
          scenario_desc: {label: 시나리오 설명, desc: "시험 절차의 각 단계별 실행 시나리오를 기술한다."}
          note: {label: 비고, blank: silent}
          round: {label: 차수, desc: "시험 시나리오별 시험을 수행한 횟수(예: 1차)"}
          steps:
            label: 시험 케이스 상세
            type: object-list
            fields:
              seq: {label: 순번, desc: "시험 케이스별 업무 처리의 순서번호를 기입한다."}
              task: {label: 업무처리 내용, desc: "시험 케이스별 업무처리 내용을 기술한다."}
              test_item: {label: 시험 항목, desc: "시험 데이터 및 시험 수행내용을 기술한다."}
              precondition: {label: 사전조건, desc: "시험 수행 사전 조건을 기술한다."}
              input: {label: 입력자료, desc: "시험을 위해 입력하는 값을 기술한다."}
              expected: {label: 예상결과, desc: "시험이 성공적으로 수행되었을 경우의 예상 결과를 기술한다."}
              screen_id: {label: 화면ID, ref: SCR, desc: "시험을 수행하는 화면 ID를 기술한다."}
              result: {label: 시험결과, result: true, desc: "설계단계에서는 기술하지 않으며, 결과서로 활용될 경우 실제 시험을 수행한 결과를 기술한다."}
              note: {label: 비고, blank: silent}
layout:
  - section: 1. 시험 시나리오
  - cards:
      source: scenarios
      sort: id
      rows:
        - kv: [{label: 시험시나리오 ID, key: id}]
        - kv: [{label: 시험시나리오명, key: name}]
        - kv: [{label: 시험시나리오설명, key: description}]
        - kv: [{label: 관련 유스케이스ID, key: usecase_id}]
        - subtable:
            source: cases
            columns:
              - {label: 시험케이스 ID, key: id, w: 4, align: center}
              - {label: 시험케이스 설명, key: description, w: 5}
              - {label: 시험 절차, key: procedure, w: 7, format: steps}
              - {label: 시나리오 설명, key: scenario_desc, w: 6}
              - {label: 비고, key: note, w: 2}
  - section: 2. 시험케이스
  - cards:
      source: scenarios
      sort: id
      flatten: cases
      rows:
        - kv: [{label: 차수, key: item.round}]
        - kv: [{label: 시험시나리오 ID, key: parent.id}, {label: 시험시나리오명, key: parent.name}]
        - kv: [{label: 시험케이스 ID, key: item.id}]
        - subtable:
            source: item.steps
            header:
              - [{label: 시험 절차, span: 2}, {rowspan: 2}, {rowspan: 2}, {rowspan: 2}, {rowspan: 2}, {rowspan: 2}, {rowspan: 2}, {rowspan: 2}]
            columns:
              - {label: 순번, key: seq, w: 1.2, align: center}
              - {label: 업무처리 내용, key: task, w: 3.3}
              - {label: 시험 항목, key: test_item, w: 3}
              - {label: 사전조건, key: precondition, w: 3}
              - {label: 입력자료, key: input, w: 3.5}
              - {label: 예상결과, key: expected, w: 3.5}
              - {label: 화면ID, key: screen_id, w: 2.5, align: center}
              - {label: 시험결과, key: result, w: 2.5, result: true}
              - {label: 비고, key: note, w: 1.5}
