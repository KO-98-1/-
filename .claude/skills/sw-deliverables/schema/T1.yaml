code: T1
name: 통합시험 결과서
doc: ITR
phase: test
scope: subsystem
orientation: landscape
extends: D10
derived_from: D10         # 'swd derive --stage test' 가 D10을 복사(현행화)해 뼈대를 만든다
results: true
purpose: 총괄시험 계획서와 통합시험 시나리오에 따라서 수행한 시험 결과를 기술한다.
method: >-
  유스케이스별로 통합 시험 시나리오를 기술하고 시나리오에 대한 시험 케이스를 기술하며 시험 예상결과와 시험결과를
  비교한다. 설계단계의 통합시험 시나리오를 현행화하여 시험을 수행 후 시험결과를 기록한다.
depends_on: [D10]
basis: "가이드 Ⅲ.4.1 목적: '총괄시험 계획서와 통합시험 시나리오에 따라서 수행한 시험 결과를 기술한다.' → 실제 통합시험 수행 결과가 있어야 한다(없으면 뼈대 모델만 두고 문서는 만들지 않는다)."   # 가이드 근거 — 이 핵심 내용을 입력·선행 산출물로 쓸 수 없으면 이 산출물은 만들지 않는다
