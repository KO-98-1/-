purpose: 총괄시험 계획서와 통합시험 시나리오에 따라서 수행한 시험 결과를 기술한다.
method: >-
  유스케이스별로 통합 시험 시나리오를 기술하고 시나리오에 대한 시험 케이스를 기술하며 시험 예상결과와 시험결과를
  비교한다. 설계단계의 통합시험 시나리오를 현행화하여 시험을 수행 후 시험결과를 기록한다.
depends_on: [D10]
