code: CC
label: R5                 # 가이드 사례1은 코드를 'R3'로 표기해 요구사항 추적표와 충돌 → R5로 구분
name: 개념적 클래스 모형 기술서
doc: CCM
phase: analysis
scope: subsystem
orientation: portrait
optional: true
purpose: 분석 관점의 개념 클래스(Boundary·Control·Entity)를 도출하여 설계 클래스와 엔티티 도출의 기반으로 삼는다.
method: 개념적 클래스 모형 기술서가 필요한 경우에 분석단계 산출물로 추가하여 작성할 수 있다. 서브시스템별로 작성한다.
depends_on: [R2]
basis: "가이드 Ⅳ.1.1: '개념적 클래스 모형 기술서가 필요한 경우에 분석단계 산출물로 추가하여 작성할 수 있다' → 선택 산출물(sw-config.yaml deliverables.optional에 있을 때만). R1·R2에서 개념 클래스를 식별할 수 있어야 한다."   # 가이드 근거 — 이 핵심 내용을 입력·선행 산출물로 쓸 수 없으면 이 산출물은 만들지 않는다
entities:
  concept_classes:
    id_type: CC
    desc: 개념 클래스 1개
    fields:
      id: {label: 개념 클래스 ID, required: true}
      name: {label: 개념 클래스명, required: true}
      stereotype: {label: 개념 클래스 설명, enum: [Boundary, Control, Entity], desc: "개념 클래스 유형(Boundary/Control/Entity)"}
      attributes: {label: 속성, type: list, desc: "Entity는 속성을 가져야 하며, Boundary/Control은 없을 수 있음('-')"}
      usecase_id: {label: 관련 유스케이스 ID, ref: UC, required: true}
  concept_diagrams:
    id_type: CCD
    desc: 개념 클래스도(서브시스템별로 작성)
    fields:
      id: {label: 개념 클래스도 ID, required: true}
      name: {label: 개념 클래스도명, required: true}
      ucd_id: {label: 관련 UCD ID, ref: UCD}
      class_ids: {label: 포함 개념 클래스, type: ids, ref: CC}
      relations:
        label: 관계
        type: object-list
        blank: silent
        fields:
          from: {label: 출발}
          to: {label: 도착}
          label: {label: 관계명}
layout:
  - section: 1. 개념 클래스 목록
  - table:
      source: concept_classes
      sort: id
      header:
        - [{label: 개념 클래스 ID, rowspan: 2}, {label: 개념 클래스명, rowspan: 2}, {label: 개념 클래스 설명, rowspan: 2}, {label: 속성, rowspan: 2}, {label: 관련 유스케이스, span: 2}]
      columns:
        - {label: 개념 클래스 ID, key: id, w: 6, align: center}
        - {label: 개념 클래스명, key: name, w: 7}
        - {label: 개념 클래스 설명, key: stereotype, w: 6, align: center}
        - {label: 속성, key: attributes, w: 8}
        - {label: ID, key: usecase_id, w: 6, align: center}
        - {label: 유스케이스명, lookup: usecase_id, field: name, w: 8}
  - section: 2. 개념 클래스도
  - cards:
      source: concept_diagrams
      sort: id
      rows:
        - kv: [{label: 개념 클래스도 ID, key: id}, {label: 개념 클래스도명, key: name}]
        - kv: [{label: 관련 서브시스템 ID, ctx: sub.id}, {label: 관련 서브시스템명, ctx: sub.name}]
        - kv: [{label: 관련 UCD ID, key: ucd_id}, {label: 관련 UCD명, lookup: ucd_id, field: name}]
        - diagram: {kind: concept, key: id}
