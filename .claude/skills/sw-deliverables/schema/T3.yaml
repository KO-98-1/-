code: T3
name: 사용자 지침서
doc: USG
phase: test
scope: subsystem
orientation: portrait
narrative: true
purpose: 개발한 시스템을 사용자가 효과적으로 사용할 수 있도록 기능적인 설명과 기타 예외처리에 대한 지침을 기술한다.
method: >-
  개발 시스템의 기능 및 예외처리 사항을 빠짐없이 기술하며, 이해하기 쉽고 구체적인 언어표현을 사용한다.
  시스템의 특성에 따라 기술하는 항목이 차이가 많이 발생할 수 있으므로 내용이 빠지지 않도록 관련항목을 수정하여 사용한다.
  기능 목록은 화면 설계서(D2)의 화면을 기준으로 한다. 화면 캡처는 실제 시스템이 있어야 하므로 없으면 비워 둔다.
depends_on: [D2, R2]
entities:
  sections:
    type: sections
    desc: "목차 번호(key)별 내용 {text, table, mermaid, _meta} — 1, 2.1, 2.2, 2.3, appendix.1, appendix.2"
  functions:
    desc: 3장 기능별 사용법 — 기능(화면) 1개 = 1항목
    fields:
      name: {label: 기능 이름, required: true}
      screen_ids: {label: 관련 화면 ID, type: ids, ref: SCR}
      description: {label: 기능 설명, type: text, desc: "기능 설명과 사용 절차(화면 캡처 위치 포함)"}
      cautions: {label: 주의 사항, type: list}
      errors:
        label: 오류 메시지 및 원인
        type: object-list
        fields:
          message: {label: 오류 메시지}
          cause: {label: 원인}
          action: {label: 처리 방법}
outline:
  - {num: "1", title: 개요, key: "1", desc: "시스템의 사용자 측면의 전체적인 개요를 기술한다."}
  - {num: "2", title: 사용 지침, desc: "시스템의 설치방법, 시작 및 종료 방법과 공통적인 내용을 화면 캡처를 이용하여 기술한다."}
  - {num: "2.1", title: 설치 방법, key: "2.1"}
  - {num: "2.2", title: 시작 및 종료 방법, key: "2.2"}
  - {num: "2.3", title: 공통 사항, key: "2.3"}
  - {num: "3", title: 기능별 사용법, desc: "기능 이름, 기능 설명, 주의 사항, 오류 메시지 및 원인 등을 빠짐없이 기술한다."}
  - repeat: functions
    num: "3.{i}"
    title_key: name
    children:
      - {num: "3.{i}.1", title: 기능 설명, key: description}
      - {num: "3.{i}.2", title: 주의 사항, key: cautions}
      - {num: "3.{i}.3", title: 오류 메시지 및 원인, key: errors, table: {columns: [오류 메시지, 원인, 처리 방법], fields: [message, cause, action]}}
  - {num: "부록", title: "", plain_title: 부록}
  - {num: "1.", title: 오류 메시지 및 처리 절차, key: appendix.1, table: {columns: [오류 메시지, 의미, 처리 방법]}}
  - {num: "2.", title: 용어, key: appendix.2, table: {columns: [용어, 설명, 별칭]}}
layout:
  - narrative: {}
