code: D12
name: 데이터 전환 및 초기데이터 설계서
doc: DMG
phase: design
scope: system
orientation: portrait
narrative: true
skippable: "초기데이터 구축내용이 없고 전환데이터가 없는 프로젝트에서는 생략 가능(가이드 Ⅰ.3)"
purpose: >-
  초기 데이터 구축 시 단시일에 대량의 데이터를 이행함에 있어 신속하고 안정적인 데이터 이행을 위하여 체계적인 절차를
  수립하여 구축 시 발생할 문제점을 사전에 차단하기 위한 계획을 수립한다.
method: >-
  업무그룹별 전환계획이 필요한 경우와 전체 미니프로젝트를 통합하여 전환하는 경우를 구분하여 계획을 수립한다.
  업무그룹별로 전환하는 경우에는 전체적인 전환 완전성을 검증한다.
depends_on: [D9]
basis: "가이드 Ⅰ.3: '관련 업무가 존재하지 않는 경우는 산출물 생략 가능함. 예) 초기데이터 구축내용이 없고, 전환데이터가 없는 프로젝트에서는 데이터 전환 및 초기데이터 설계서 생략가능' → 입력 자료에 데이터 전환 또는 초기데이터 구축 업무가 있어야 한다."   # 가이드 근거 — 이 핵심 내용을 입력·선행 산출물로 쓸 수 없으면 이 산출물은 만들지 않는다
